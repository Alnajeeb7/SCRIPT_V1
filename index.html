<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iTantra — Video Script</title>
<style>
:root{--ink:#1C212E;--mut:#6B7280;--amb:#C26906;--line:#E7E3DA;--soft:#F7F5F0;--fs:19px}
*{box-sizing:border-box;-webkit-text-size-adjust:100%}
html{scroll-behavior:auto}
body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 80px}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 0 8px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:16px;margin:0;letter-spacing:-.01em;flex:1 1 auto}
h1 small{display:block;font-weight:400;font-size:12px;color:var(--mut);margin-top:2px}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-size:14px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 11px;cursor:pointer;line-height:1;transition:.15s ease}
button:hover{background:var(--soft)}
button:active{transform:scale(.97)}
#clock{font-variant-numeric:tabular-nums;min-width:58px;text-align:center;font-weight:600}
#clock.run{color:var(--amb);border-color:var(--amb)}
.scrollbar{display:flex;align-items:center;gap:7px;margin-top:9px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:#FCFBF8}
.scroll-title{font-size:12px;color:var(--mut);font-weight:600;margin-right:2px;white-space:nowrap}
#scrollToggle{font-weight:700;min-width:66px}
#scrollToggle.active{background:var(--amb);color:#fff;border-color:var(--amb)}
.speed{display:flex;align-items:center;gap:4px;margin-left:auto}
.speed button{padding:7px 8px;min-width:32px}
#speedValue{min-width:43px;text-align:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--amb);color:#fff;border-color:var(--amb)}
.sec{border-top:1px solid var(--line);padding:20px 0 8px;scroll-margin-top:130px}
.sec:first-of-type{border-top:0}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.who{color:var(--amb);font-weight:700}
.cam{border:1px solid var(--line);border-radius:5px;padding:1px 6px;letter-spacing:.03em}
h2{font-size:1.02em;margin:8px 0 12px;line-height:1.3}
.lines p{margin:0 0 .75em;font-size:var(--fs);line-height:1.62}
.formula{margin:14px 0;padding:12px 14px;background:var(--soft);border-left:3px solid var(--amb);border-radius:0 7px 7px 0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;line-height:1.55;overflow-x:auto}
.cue{font-size:.78em;color:var(--mut);font-style:italic;line-height:1.5;border-left:2px solid var(--line);padding-left:11px;margin:14px 0 4px}
.sec.current{background:linear-gradient(90deg,rgba(194,105,6,.055),transparent)}
@media(max-width:600px){
.wrap{padding-left:14px;padding-right:14px}
.bar{gap:7px}
h1{width:100%;flex-basis:100%;margin-bottom:2px}
.ctl{width:100%}.ctl button{flex:1}
.scrollbar{flex-wrap:wrap}.scroll-title{width:100%}
.speed{margin-left:0;width:100%}.speed button{flex:1}
#speedValue{flex:0 0 52px}.sec{scroll-margin-top:185px}
}
@media print{header,.chips,.scrollbar{display:none}.sec{break-inside:avoid;border-top:0}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="bar">
<h1>iTantra — Video Script<small>~7 min · 6 speakers · Technical SIH presentation</small></h1>
<div class="ctl">
<button id="minus" aria-label="Smaller text">A−</button>
<button id="plus" aria-label="Bigger text">A+</button>
<button id="clock">0:00</button>
<button id="reset" aria-label="Reset timer">↻</button>
</div>
</div>
<div class="scrollbar">
<span class="scroll-title">AUTO SCROLL</span>
<button id="scrollToggle">▶ Start</button>
<button id="scrollReset">↕ Reset</button>
<div class="speed">
<button id="speedMinus">−</button>
<span id="speedValue">1.0×</span>
<button id="speedPlus">+</button>
</div>
</div>
<div class="chips" id="chips"></div>
</header>
<main id="out"></main>
</div>
<script>
const S=[
{n:1,sp:0,who:"Speaker 1",time:"0:00 – 1:05",dur:"65 s",w:240,cam:"On camera + phone video",t:"The problem — why transmit the voice?",l:[
"Look at this video.",
"Imagine you're communicating in a situation like this.",
"Heavy rain, a noisy environment, limited connectivity, and an important message that needs to reach someone immediately.",
"In a conventional voice call, we continuously transmit audio.",
"And this is where the problem begins.",
"Voice is a continuous data stream.",
"For example, if raw audio is sampled at 16 kilohertz, with 16 bits per sample and one audio channel, the raw PCM data rate is 16,000 × 16, which is 256,000 bits per second, or 256 kilobits per second.",
"That's 32 kilobytes per second before considering any additional encoding or communication overhead.",
"But we don't actually need to transmit the waveform if the receiver only needs to understand what was spoken.",
"So instead of asking, 'How can we transmit more audio?' we asked, 'Can we transmit the information contained in the speech instead?'",
"Our approach is to process the speech locally, convert it into text, and transmit only that text.",
"The receiver then converts the text back into speech.",
"So the communication path becomes: Voice, Text, Communication, Voice.",
"And that is the fundamental idea behind iTantra."
],formula:["Example raw PCM:","16,000 samples/sec × 16 bits/sample × 1 channel","= 256 kbps = 32 kB/s"],c:"Speaker holds the phone toward the camera. Show the heavy-rain/flood video first, then transition to the iTantra concept."},

{n:2,sp:1,who:"Speaker 2",time:"1:05 – 2:10",dur:"65 s",w:245,cam:"On camera + architecture slide",t:"The solution — local AI, lightweight communication",l:[
"iTantra is an Android application designed around a fully local speech communication pipeline.",
"The system has several stages.",
"First, the microphone captures speech.",
"Then our voice activity detection identifies the actual speech region and detects pauses or stoppages.",
"This is important because we don't want to continuously process silence.",
"Once a sentence boundary is detected, the speech segment is passed to the offline STT model.",
"The resulting text becomes our communication payload.",
"That payload is then transferred between devices using either Bluetooth or Wi-Fi.",
"On the receiver, the text is passed into the local TTS pipeline and converted back into speech.",
"One of our architectural decisions is to keep the AI pipeline independent from the transport layer.",
"The STT model doesn't need to know whether the message is being sent over Bluetooth or Wi-Fi.",
"Similarly, the TTS system only needs the received text.",
"This gives us a modular architecture: speech layer, AI layer, transport layer and playback layer.",
"It also makes benchmarking easier because we can measure each stage independently and then calculate the complete end-to-end latency.",
"Most importantly, the system does not depend on a cloud speech API. The speech recognition and speech synthesis are performed locally according to the selected offline models.",
"The communication itself is also device-to-device."
],formula:["Speech → VAD → Offline STT → Text","→ Bluetooth / Wi-Fi → Offline TTS → Speech"],c:"Show the complete architecture diagram. Highlight VAD, STT, transport and TTS one stage at a time."},

{n:3,sp:2,who:"Speaker 3",time:"2:10 – 3:20",dur:"70 s",w:250,cam:"Live two-phone demonstration",t:"Demo — Push-to-Talk",l:[
"Now let's test the complete loop.",
"This phone is our STT device.",
"This phone is our TTS device.",
"They are connected directly, and there is no internet dependency.",
"I press Push-to-Talk and say: The weather is clear. Send the next message.",
"The microphone captures my speech.",
"The VAD detects the speech segment and identifies the pause.",
"The STT model processes the segment and produces the text.",
"You can see the recognized sentence here.",
"Now that text is transmitted to the second phone.",
"The receiver gets the text and passes it to the local TTS engine.",
"And the receiver hears the sentence.",
"Now we measure the complete path.",
"We define our end-to-end latency as the sum of STT time, transmission time, TTS time and the time until playback starts.",
"This is important because a system can have a fast STT model but still feel slow if networking or TTS takes too long.",
"So instead of reporting only model inference time, we measure what the user actually experiences: the time from the spoken sentence to the beginning of the reproduced speech.",
"For Push-to-Talk, the user gets a simple interaction: Press, Speak, Release, Receive."
],formula:["Tₑ₂ₑ = TSTT + TTransmission + TTTS + TPlayback Start"],c:"Show both physical phones. Press Push-to-Talk, speak, show recognized text on Phone A, then show the text arriving and speech playing on Phone B. Display the measured latency from the actual implementation."},

{n:4,sp:3,who:"Speaker 4",time:"3:20 – 4:30",dur:"70 s",w:255,cam:"On camera + networking demo",t:"Bitrate, byte rate, Bluetooth and Wi-Fi",l:[
"Now let's look at the communication itself.",
"There are two terms we need to distinguish: bitrate and byte rate.",
"Bitrate is the number of bits transferred per second.",
"Byte rate is the number of bytes transferred per second.",
"Since one byte contains eight bits, bitrate equals byte rate multiplied by eight.",
"For our system, we don't want to assume a theoretical number. We measure the actual transmitted payload.",
"If a message contains N bytes and takes T seconds to transmit, then the byte rate is N divided by T.",
"And the bitrate is 8N divided by T.",
"We can also separate payload from communication overhead.",
"For example, our application message can contain fields such as the message ID, language information, message type and text.",
"The actual network measurement should therefore distinguish between application payload, protocol overhead and total transmitted data.",
"That gives us a much more honest benchmark.",
"With Bluetooth, the phones communicate directly over the supported Bluetooth connection.",
"With Wi-Fi, the same application-level message can be transferred over the local Wi-Fi connection.",
"The communication layer can therefore be benchmarked independently from the speech models.",
"And because we're transmitting text rather than continuous audio, the payload depends mainly on the amount of recognized text rather than the duration of an audio stream."
],formula:["1 Byte = 8 bits","Byte Rate = N / T","Bitrate = 8N / T","","Measure actual payload + protocol overhead","Do not claim a bandwidth saving without a baseline measurement."],c:"Show a network statistics panel with actual measured bytes, payload size, transmission time and bitrate. Compare Bluetooth and Wi-Fi using real measurements."},

{n:5,sp:4,who:"Speaker 5",time:"4:30 – 5:35",dur:"65 s",w:250,cam:"On camera + multilingual and alert demo",t:"Accuracy, ten languages and emergency mode",l:[
"Reducing the transmitted data is useful only if the speech recognition remains accurate.",
"So accuracy is one of our primary evaluation parameters.",
"For STT, we use Word Error Rate, or WER.",
"The standard calculation is WER equals substitutions plus deletions plus insertions, divided by the number of words in the reference transcription.",
"A lower WER means fewer recognition errors.",
"We will benchmark the system across the languages supported by our application: Hindi, Gujarati, Marathi, Kannada, Malayalam, Tamil, Telugu, Odia, Bengali and English.",
"TTS is evaluated separately because recognition accuracy and speech intelligibility are different problems.",
"For TTS, we look at pronunciation, intelligibility and how naturally the generated speech flows.",
"We also have an alert communication mode.",
"Consider the message: Emergency. Move to the designated safe location immediately.",
"Instead of transmitting a voice recording, the text message is transmitted and reconstructed as speech on the receiving device.",
"The application can use its configured high-priority alert audio path for such messages, subject to Android device and operating-system audio policies.",
"This gives us a communication architecture where the information itself is the primary payload."
],formula:["WER = (S + D + I) / N","","S = Substitution","D = Deletion","I = Insertion","N = Reference words"],c:"Show the ten-language selector, perform a short multilingual demonstration, then demonstrate a separate alert message."},

{n:6,sp:5,who:"Speaker 6",time:"5:35 – 6:45",dur:"70 s",w:270,cam:"On camera + benchmark dashboard",t:"Efficiency, RTF and technical novelty",l:[
"The final challenge is making all of this run on a low and mid-range Android device.",
"We therefore don't evaluate only whether the application works.",
"We measure the resources required to make it work.",
"Our evaluation includes model size, application size, RAM usage, CPU usage during idle listening, STT accuracy, TTS intelligibility, transmission bitrate and complete end-to-end latency.",
"We also measure Real-Time Factor, or RTF.",
"The formula is processing time divided by audio duration.",
"For example, if a ten-second audio segment takes five seconds to process, the RTF is 0.5.",
"If it takes ten seconds, the RTF is 1.",
"If it takes twenty seconds, the RTF is 2.",
"An RTF below one means that particular processing stage completes faster than the duration of the audio being processed.",
"We also measure the actual communication payload rather than claiming a theoretical bandwidth saving.",
"Our technical contribution is therefore not simply STT plus TTS.",
"It is the integration of pause-aware speech segmentation, offline multilingual STT, compact text-based communication, Bluetooth and Wi-Fi transport, offline TTS, Push-to-Talk and continuous conversation modes, and end-to-end performance measurement.",
"The entire pipeline is designed around one objective: process locally, transmit only the required information, and reproduce the message with low latency."
],formula:["RTF = Processing Time / Audio Duration","","RTF < 1 → faster than real-time processing","RTF = 1 → real-time","RTF > 1 → slower than real-time"],c:"Show a benchmark dashboard. Every number must come from the actual implementation: model size, APK size, RAM, CPU, WER, measured bitrate, latency and RTF."},

{n:7,sp:-1,who:"All Six",time:"6:45 – 7:00",dur:"15 s",w:55,cam:"All six on camera",t:"Closing",l:[
"Speaker 1: We are Team ______ from ______.",
"Speaker 2: This is iTantra.",
"Speaker 3: We don't need to transmit the voice itself.",
"Speaker 4: We transmit the information through Bluetooth or Wi-Fi.",
"Speaker 5: And reconstruct it as speech on the other device.",
"Speaker 6: Ten Indian languages. Fully offline. Designed for low-bandwidth communication.",
"All six: Thank you."
],c:"Show iTantra logo, team names and final architecture. Keep the final screen clean."}
];

const out=document.getElementById("out");
const chips=document.getElementById("chips");
const clock=document.getElementById("clock");
const scrollToggle=document.getElementById("scrollToggle");
const scrollReset=document.getElementById("scrollReset");
const speedMinus=document.getElementById("speedMinus");
const speedPlus=document.getElementById("speedPlus");
const speedValue=document.getElementById("speedValue");

let pick="all",fs=19,timer=0,timerTick=null,autoScroll=false,scrollSpeed=1;
let scrollAnimation=null,lastFrame=null;

try{
  const saved=JSON.parse(localStorage.getItem("itantraScript")||"{}");
  if(saved.fs)fs=saved.fs;
  if(saved.pick!==undefined)pick=saved.pick;
  if(saved.scrollSpeed)scrollSpeed=saved.scrollSpeed;
}catch(e){}

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function draw(){
  out.innerHTML="";
  S.filter(s=>pick==="all"||s.sp===pick||(pick===8&&s.sp===-1)).forEach(s=>{
    const d=document.createElement("section");
    d.className="sec";
    let html='<div class="meta"><span class="who">'+esc(s.who)+'</span><span>'+esc(s.time)+'</span><span>'+esc(s.dur)+'</span><span>'+esc(s.w)+' words</span><span class="cam">'+esc(s.cam)+'</span></div><h2>'+s.n+'. '+esc(s.t)+'</h2><div class="lines">';
    s.l.forEach(p=>html+="<p>"+esc(p)+"</p>");
    html+="</div>";
    if(s.formula&&s.formula.length){
      html+='<div class="formula">';
      s.formula.forEach(line=>html+=line===""?"<br>":esc(line)+"<br>");
      html+="</div>";
    }
    html+='<div class="cue"><b>Screen:</b> '+esc(s.c)+'</div>';
    d.innerHTML=html;
    out.appendChild(d);
  });
}

function buildChips(){
  const list=[["all","Full script"],[0,"Speaker 1"],[1,"Speaker 2"],[2,"Speaker 3"],[3,"Speaker 4"],[4,"Speaker 5"],[5,"Speaker 6"],[8,"Closing"]];
  chips.innerHTML="";
  list.forEach(([value,label])=>{
    const b=document.createElement("button");
    b.className="chip"+(value===pick?" on":"");
    b.textContent=label;
    b.onclick=()=>{
      pick=value;
      save();
      buildChips();
      draw();
      window.scrollTo({top:0,behavior:"instant"});
    };
    chips.appendChild(b);
  });
}

function setFs(v){
  fs=Math.max(14,Math.min(34,v));
  document.documentElement.style.setProperty("--fs",fs+"px");
  save();
}

function fmt(n){
  return Math.floor(n/60)+":"+String(n%60).padStart(2,"0");
}

clock.onclick=()=>{
  if(timerTick){
    clearInterval(timerTick);
    timerTick=null;
    clock.classList.remove("run");
  }else{
    timerTick=setInterval(()=>{
      timer++;
      clock.textContent=fmt(timer);
    },1000);
    clock.classList.add("run");
  }
};

document.getElementById("reset").onclick=()=>{
  clearInterval(timerTick);
  timerTick=null;
  timer=0;
  clock.textContent="0:00";
  clock.classList.remove("run");
};

function autoScrollFrame(timestamp){
  if(!autoScroll){
    lastFrame=null;
    return;
  }
  if(lastFrame===null)lastFrame=timestamp;
  const delta=(timestamp-lastFrame)/1000;
  lastFrame=timestamp;

  const baseSpeed=18;
  window.scrollBy(0,baseSpeed*scrollSpeed*delta);

  const atBottom=window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-5;
  if(atBottom){
    stopAutoScroll();
    return;
  }
  scrollAnimation=requestAnimationFrame(autoScrollFrame);
}

function startAutoScroll(){
  if(autoScroll)return;
  autoScroll=true;
  scrollToggle.textContent="❚❚ Pause";
  scrollToggle.classList.add("active");
  lastFrame=null;
  scrollAnimation=requestAnimationFrame(autoScrollFrame);
}

function stopAutoScroll(){
  autoScroll=false;
  scrollToggle.textContent="▶ Start";
  scrollToggle.classList.remove("active");
  if(scrollAnimation)cancelAnimationFrame(scrollAnimation);
  scrollAnimation=null;
  lastFrame=null;
}

scrollToggle.onclick=()=>{
  if(autoScroll)stopAutoScroll();
  else startAutoScroll();
};

scrollReset.onclick=()=>{
  stopAutoScroll();
  window.scrollTo({top:0,behavior:"smooth"});
};

function setSpeed(value){
  scrollSpeed=Math.max(0.1,Math.min(10,value));
  speedValue.textContent=scrollSpeed.toFixed(1)+"×";
  save();
}

speedMinus.onclick=()=>{
  const step=scrollSpeed<=1?0.1:0.5;
  setSpeed(Math.round((scrollSpeed-step)*10)/10);
};

speedPlus.onclick=()=>{
  const step=scrollSpeed<1?0.1:0.5;
  setSpeed(Math.round((scrollSpeed+step)*10)/10);
};

document.addEventListener("keydown",e=>{
  if(e.code==="Space"&&document.activeElement.tagName!=="BUTTON"){
    e.preventDefault();
    autoScroll?stopAutoScroll():startAutoScroll();
  }
  if(e.key==="ArrowUp"){
    setSpeed(Math.round((scrollSpeed-0.1)*10)/10);
  }
  if(e.key==="ArrowDown"){
    setSpeed(Math.round((scrollSpeed+0.1)*10)/10);
  }
});

function save(){
  try{
    localStorage.setItem("itantraScript",JSON.stringify({fs,pick,scrollSpeed}));
  }catch(e){}
}

document.getElementById("minus").onclick=()=>setFs(fs-1);
document.getElementById("plus").onclick=()=>setFs(fs+1);

setFs(fs);
setSpeed(scrollSpeed);
buildChips();
draw();
</script>
</body>
</html>
